name: Update latest Vietlott draws

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO: tpc-pascal/drawlog

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PASCAL_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PASCAL_AUTOMATION_PRIVATE_KEY }}
          repositories: drawlog
          permission-contents: write

      - name: Fetch and validate official results
        run: python scripts/update_latest_draws.py

      - name: Commit changed results
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/latest-results.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The latest results have not changed."
            exit 0
          fi

          git config user.name "pascal-automation-agent[bot]"
          git config user.email "348848148+pascal-automation-agent[bot]@users.noreply.github.com"
          git add web/latest-results.js
          git commit -m "chore(results): refresh latest draw snapshot" -m "Work done
          - Fetch and validate the latest published results from Vietlott.

          Effect
          - Refresh the public browser snapshot for all active products.

          Benefits
          - Keep the results panel current without sending ticket data anywhere.

          Files changed
          - web/latest-results.js"

          cat > "$RUNNER_TEMP/github-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/github-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/github-askpass" \
            GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy updated results to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cp app.py index.html requirements.txt "$temp_dir/"
          cp -R web "$temp_dir/web"
          cp -R scripts "$temp_dir/scripts"
          cp space/README.md "$temp_dir/README.md"

          cd "$temp_dir"
          git init --initial-branch=main
          git config user.name "tpc-pascal"
          git config user.email "tpcmemory2005@gmail.com"
          git add --all
          git commit -m "ci: deploy Drawlog with latest results"

          cat > "$RUNNER_TEMP/hf-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "hf_user" ;;
            *) printf '%s\n' "$HF_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/hf-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/hf-askpass" \
            GIT_TERMINAL_PROMPT=0 \
            git push --force "https://huggingface.co/spaces/${HF_REPO}" main
