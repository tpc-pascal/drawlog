name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gradio runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: ./scripts/check
      - name: Verify Gradio Space app
        run: python -m unittest discover -s tests -p 'test_space_app.py'
